  <!-- JavaScriptの取得・評価中にも進行状況を表示するため、必要最小限のCSSをHTMLに含める -->
  <style>
    body {
      margin: 0;
    }

    #app-static-loader {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
      background: #fff;
      color: #4b5563;
      font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      text-align: center;
    }

    .app-static-loader__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .app-static-loader__spinner {
      width: 2.5rem;
      height: 2.5rem;
      box-sizing: border-box;
      border: 4px solid #8cb9dd;
      border-top-color: transparent;
      border-radius: 9999px;
      animation: app-static-loader-spin 0.8s linear infinite;
    }

    .app-static-loader__label {
      margin: 0;
      font-size: 0.875rem;
    }

    @keyframes app-static-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-static-loader__spinner {
        animation: none;
        border-top-color: #8cb9dd;
        opacity: 0.7;
      }
    }
  </style>
